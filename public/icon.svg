<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="idmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base with Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#idmGradient)" filter="url(#shadow)" />

  <!-- Inner Plate -->
  <rect x="48" y="48" width="416" height="416" rx="88" fill="#0f172a" fill-opacity="0.4" stroke="rgba(255,255,255,0.15)" stroke-width="3" />

  <!-- SaveToVideo Download Arrow Symbol -->
  <g transform="translate(256, 230)">
    <!-- Main Arrow Shaft -->
    <rect x="-32" y="-100" width="64" height="120" rx="16" fill="url(#arrowGradient)" />
    <!-- Arrow Head -->
    <polygon points="0,90 -90,-10 90,-10" fill="url(#arrowGradient)" />
  </g>

  <!-- Multi-Connection Segments Base Tray -->
  <g transform="translate(136, 360)">
    <!-- Base Bar -->
    <rect x="0" y="0" width="240" height="28" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
    <!-- Active Parallel Chunks -->
    <rect x="6" y="5" width="48" height="18" rx="4" fill="#38bdf8" />
    <rect x="62" y="5" width="54" height="18" rx="4" fill="#10b981" />
    <rect x="124" y="5" width="50" height="18" rx="4" fill="#38bdf8" />
    <rect x="182" y="5" width="52" height="18" rx="4" fill="#10b981" />
  </g>

  <!-- Text SaveToVideo Badge -->
  <text x="256" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">STV</text>
</svg>
